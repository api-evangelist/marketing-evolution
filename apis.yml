name: Marketing Evolution
description: Marketing Evolution is an enterprise marketing measurement and analytics company whose stated
  mission is to "make marketing knowable." It ships two products. Substrate is positioned as a system of
  record for marketing performance, unifying fragmented media, audience, commerce and third-party data,
  enriching it, and publishing standardized output to data warehouses, BI tools, CDPs and agents. Darwin
  is the decisioning layer on top, running unified marketing measurement (MMM plus multi-touch attribution),
  budget scenario modeling and ROI forecasting, media performance intelligence, and always-on agents with
  automated anomaly detection. Roughly thirty published connectors cover the major ad platforms, warehouses,
  CRM and BI systems. The company is backed by Insight Partners and sells exclusively through an enterprise
  demo-request motion. As of this enrichment pass it publishes no developer portal, API reference, or
  machine-readable specification; its API host, api.marketingevolution.com, returns HTTP 403 to every
  anonymous request, and its published integration mechanism is data-plane (SFTP, Amazon S3, Snowflake
  data shares) rather than a public request/response API.
